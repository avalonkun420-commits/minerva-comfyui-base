name: Build MINERVA ComfyUI Base

on:
  workflow_dispatch:
  push:
    branches: [ "main" ]
    paths:
      - "Dockerfile"
      - "run.sh"
      - "status.sh"
      - ".github/workflows/build.yml"

permissions:
  contents: read
  packages: write

jobs:
  build:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - name: Lowercase owner
        shell: bash
        run: echo "OWNER_LC=${GITHUB_REPOSITORY_OWNER,,}" >> "$GITHUB_ENV"

      - uses: docker/setup-buildx-action@v3

      - uses: docker/login-action@v3
        with:
          registry: ghcr.io
          username: ${{ github.actor }}
          password: ${{ secrets.GITHUB_TOKEN }}

      - name: Build and push
        uses: docker/build-push-action@v6
        with:
          context: .
          push: true
          build-args: |
            COMFYUI_REF=v0.34.0
          tags: |
            ghcr.io/${{ env.OWNER_LC }}/minerva-comfyui-base:v1
            ghcr.io/${{ env.OWNER_LC }}/minerva-comfyui-base:comfyui-0.34.0
          cache-from: type=gha
          cache-to: type=gha,mode=max

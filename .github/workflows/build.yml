name: Build MINERVA Viggle Thin

on:
  workflow_dispatch:
  push:
    branches: [ "main" ]
    paths:
      - "Dockerfile"
      - "minerva-start.sh"
      - "status.sh"
      - ".github/workflows/build.yml"

permissions:
  contents: read
  packages: write

concurrency:
  group: minerva-viggle-thin
  cancel-in-progress: true

jobs:
  build:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - name: Lowercase owner
        shell: bash
        run: echo "OWNER_LC=${GITHUB_REPOSITORY_OWNER,,}" >> "$GITHUB_ENV"

      - uses: docker/setup-buildx-action@v3

      - uses: docker/login-action@v3
        with:
          registry: ghcr.io
          username: ${{ github.actor }}
          password: ${{ secrets.GITHUB_TOKEN }}

      - name: Build and push thin wrapper
        uses: docker/build-push-action@v6
        with:
          context: .
          push: true
          tags: |
            ghcr.io/${{ env.OWNER_LC }}/minerva-comfyui-base:v1
            ghcr.io/${{ env.OWNER_LC }}/minerva-comfyui-base:thin-viggle-v1
          cache-from: type=gha
          cache-to: type=gha,mode=max
